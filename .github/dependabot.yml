version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@sapphire-sh/utils'
    cooldown:
      exclude:
        - '@sapphire-sh/utils'
    ignore:
      - dependency-name: '@sapphire-sh/utils'
    assignees:
      - 'sapphire-sh'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - 'sapphire-sh'
